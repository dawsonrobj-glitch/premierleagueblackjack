<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premier League Blackjack</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #070b16;
    --bg2:       #0a1020;
    --surface:   #101830;
    --surface2:  #16203c;
    --border:    #24304f;
    --text:      #eef2fb;
    --muted:     #7d89a8;
    --cyan:      #00e5ff;
    --cyan-dim:  rgba(0,229,255,0.12);
    --lime:      #c3ff3d;
    --lime-dim:  rgba(195,255,61,0.12);
    --magenta:   #ff2d78;
    --mag-dim:   rgba(255,45,120,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: var(--bg); }

  body {
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, rgba(0,229,255,0.06), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Barlow Semi Condensed', sans-serif;
    min-height: 100vh;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── NAV ── */
  .nav {
    position: sticky; top: 0; z-index: 10;
    background: rgba(7,11,22,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
  }

  .nav-btn {
    flex: 1;
    padding: 1rem 0.5rem;
    background: none; border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.9rem; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer; transition: color 0.15s, border-color 0.15s;
  }
  .nav-btn.active { color: var(--cyan); border-bottom-color: var(--cyan); }

  .screen { display: none; padding: 1.25rem 1rem 5rem; max-width: 720px; margin: 0 auto; }
  .screen.active { display: block; }

  /* ── HEADER ── */
  .masthead {
    position: relative;
    padding: 1.5rem 0 1.25rem;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  .masthead::before {
    content: ''; position: absolute; left: 0; bottom: -1px;
    width: 64px; height: 3px; background: var(--cyan);
    box-shadow: 0 0 12px var(--cyan);
  }
  .eyebrow {
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.72rem; font-weight: 600;
    letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--cyan); margin-bottom: 0.35rem;
  }
  .masthead h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 2.5rem; font-weight: 700;
    letter-spacing: 0.01em; line-height: 0.92;
    text-transform: uppercase;
  }
  .masthead h1 em { font-style: normal; color: var(--cyan); }
  .updated {
    margin-top: 0.5rem;
    font-size: 0.72rem; color: var(--muted);
    letter-spacing: 0.04em;
  }
  .updated b { color: var(--lime); font-weight: 600; }

  /* ── STAT STRIP ── */
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 0; margin-bottom: 1.5rem;
    border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; background: var(--surface);
  }
  .stat { padding: 0.85rem 0.6rem; text-align: center; position: relative; }
  .stat + .stat { border-left: 1px solid var(--border); }
  .stat-val {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.9rem; font-weight: 700; line-height: 1;
  }
  .stat-val.live { color: var(--lime); }
  .stat-val.bust { color: var(--magenta); }
  .stat-lbl {
    font-size: 0.6rem; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); margin-top: 0.35rem;
  }

  /* ── IDENTITY CHIP ── */
  .identity { display: flex; justify-content: flex-end; margin-bottom: 0.75rem; min-height: 26px; }
  .id-chip {
    display: inline-flex; align-items: center; gap: 0.4rem;
    background: var(--cyan-dim); border: 1px solid rgba(0,229,255,0.3);
    color: var(--cyan); border-radius: 4px;
    padding: 0.3rem 0.7rem; font-size: 0.72rem; font-weight: 600;
    letter-spacing: 0.04em; cursor: pointer;
  }
  .id-chip.hidden { display: none; }

  /* ── FILTERS ── */
  .filters { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .filt {
    padding: 0.4rem 1rem; border-radius: 3px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.75rem; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; transition: all 0.15s;
  }
  .filt.active { background: var(--cyan); border-color: var(--cyan); color: #04121a; }

  /* ── LEADERBOARD ── */
  .board { display: flex; flex-direction: column; gap: 0.6rem; }

  .row {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.9rem 1rem 0.9rem 1.25rem;
    display: grid;
    grid-template-columns: 34px 1fr auto;
    gap: 0.85rem; align-items: start;
    animation: slideIn 0.3s ease both;
    overflow: hidden;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-6px);} to { opacity:1; transform: none; } }

  .row.busted { opacity: 0.55; }
  .row.r1 { border-color: rgba(0,229,255,0.5); box-shadow: inset 0 0 0 1px rgba(0,229,255,0.15), 0 0 20px rgba(0,229,255,0.06); }
  .row.mine { border-color: rgba(195,255,61,0.5) !important; }
  .row.mine::after {
    content: 'YOU'; position: absolute; top: 0.6rem; right: 0.75rem;
    font-family: 'Rajdhani', sans-serif; font-size: 0.55rem; font-weight: 700;
    letter-spacing: 0.15em; color: var(--lime);
    background: var(--lime-dim); border: 1px solid rgba(195,255,61,0.3);
    padding: 0.1rem 0.35rem; border-radius: 3px;
  }

  .rank {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.5rem; font-weight: 700;
    color: var(--muted); text-align: center; line-height: 1.4;
  }
  .row.r1 .rank { color: var(--cyan); }
  .rank.bust-rank {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.08em;
    color: var(--magenta); margin-top: 6px;
  }

  .entrant { min-width: 0; }
  .entrant-name {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.15rem; font-weight: 700;
    letter-spacing: 0.01em; margin-bottom: 0.5rem;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .paid-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 50%;
    font-size: 0.7rem; font-weight: 700; flex-shrink: 0;
    font-family: 'Barlow Semi Condensed', sans-serif;
  }
  .paid-badge.yes { background: var(--lime-dim); color: var(--lime); border: 1px solid rgba(195,255,61,0.5); }
  .paid-badge.no  { background: transparent; color: var(--muted); border: 1px dashed var(--border); }

  .picks { display: flex; flex-direction: column; gap: 0.3rem; }
  .pick { display: flex; align-items: center; gap: 0.55rem; font-size: 0.82rem; }
  .club-badge {
    width: 8px; height: 16px; border-radius: 2px; flex-shrink: 0;
  }
  .pick .pname { flex: 1; color: #cdd6ea; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick .pclub { font-size: 0.66rem; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; flex-shrink: 0; }
  .pick .pg  { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 0.9rem; color: var(--lime); min-width: 1.4rem; text-align: right; }
  .pick .pg.z { color: #4a5678; }
  .pick.dead .pname { color: var(--magenta); text-decoration: line-through; text-decoration-color: rgba(255,45,120,0.6); }
  .pick .out-mark { color: var(--magenta); font-size: 0.7rem; margin-left: 0.25rem; }

  /* Score cluster */
  .score { text-align: right; flex-shrink: 0; min-width: 62px; }
  .score-total {
    font-family: 'Rajdhani', sans-serif;
    font-size: 2.4rem; font-weight: 700; line-height: 0.9;
  }
  .score-total.lead { color: var(--cyan); text-shadow: 0 0 16px rgba(0,229,255,0.4); }
  .score-total.bust { color: var(--magenta); }
  .score-cap {
    font-size: 0.62rem; font-weight: 600; color: var(--muted);
    letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px;
  }
  .rail {
    height: 4px; background: var(--bg2); border-radius: 2px;
    margin-top: 8px; overflow: hidden; border: 1px solid var(--border);
  }
  .rail-fill { height: 100%; border-radius: 2px; transition: width 0.6s cubic-bezier(.2,.8,.2,1); }

  .divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.25rem 0 0.4rem; }
  .divider span {
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.68rem; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--magenta);
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ── PLAYERS SCREEN ── */
  .plist { display: flex; flex-direction: column; gap: 0.5rem; }
  .prow {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.8rem 1rem;
    display: flex; align-items: center; gap: 0.85rem;
    animation: slideIn 0.3s ease both;
  }
  .prow.out { opacity: 0.55; }
  .prank {
    font-family: 'Rajdhani', sans-serif; font-size: 1.15rem; font-weight: 700;
    color: var(--muted); width: 26px; text-align: center; flex-shrink: 0;
  }
  .pbadge { width: 10px; height: 26px; border-radius: 3px; flex-shrink: 0; }
  .pinfo { flex: 1; min-width: 0; }
  .prow .pn { font-family: 'Rajdhani', sans-serif; font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 0.4rem; }
  .prow .pc { font-size: 0.7rem; color: var(--muted); margin-top: 0.15rem; }
  .pgoals { font-family: 'Rajdhani', sans-serif; font-size: 1.9rem; font-weight: 700; color: var(--lime); flex-shrink: 0; min-width: 2.2rem; text-align: right; }
  .pgoals.z { color: var(--muted); }
  .pgl { font-size: 0.58rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; text-align: right; margin-top: -2px; }
  .out-tag {
    font-size: 0.55rem; font-weight: 700; letter-spacing: 0.08em;
    color: var(--magenta); background: var(--mag-dim);
    border: 1px solid rgba(255,45,120,0.3); border-radius: 3px;
    padding: 0.1rem 0.35rem;
  }

  /* ── OVERLAY ── */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(4,7,14,0.9); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; padding: 1.5rem;
  }
  .overlay.hidden { display: none; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 2rem 1.5rem; width: 100%; max-width: 340px; text-align: center;
    position: relative; overflow: hidden;
  }
  .modal::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--cyan); box-shadow: 0 0 12px var(--cyan);
  }
  .modal .kick {
    font-family: 'Rajdhani', sans-serif; font-size: 0.7rem; font-weight: 600;
    letter-spacing: 0.28em; text-transform: uppercase; color: var(--cyan); margin-bottom: 0.6rem;
  }
  .modal h2 { font-family: 'Rajdhani', sans-serif; font-size: 1.7rem; font-weight: 700; text-transform: uppercase; margin-bottom: 0.4rem; }
  .modal p { font-size: 0.82rem; color: var(--muted); line-height: 1.5; margin-bottom: 1.5rem; }
  .modal input {
    width: 100%; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 7px; color: var(--text);
    font-family: 'Barlow Semi Condensed', sans-serif; font-size: 1rem; font-weight: 500;
    padding: 0.75rem 1rem; text-align: center; outline: none; margin-bottom: 0.6rem;
    transition: border-color 0.15s;
  }
  .modal input:focus { border-color: var(--cyan); }
  .modal input.err { border-color: var(--magenta); }
  .modal-err { font-size: 0.74rem; color: var(--magenta); min-height: 1.1rem; margin-bottom: 0.6rem; }
  .modal-btn {
    width: 100%; background: var(--cyan); border: none; border-radius: 7px;
    color: #04121a; font-family: 'Rajdhani', sans-serif; font-size: 0.9rem; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; padding: 0.8rem; cursor: pointer; margin-bottom: 0.7rem;
  }
  .modal-skip { font-size: 0.74rem; color: var(--muted); background: none; border: none; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  #name-picker { margin-bottom: 0.75rem; text-align: left; }
  .picker-lbl { font-size: 0.72rem; color: var(--muted); margin-bottom: 0.5rem; text-align: center; }
  .picker-btn {
    display: block; width: 100%; text-align: left;
    background: var(--bg2); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px;
    padding: 0.6rem 0.9rem; margin-bottom: 0.4rem;
    font-family: 'Barlow Semi Condensed', sans-serif; font-size: 0.9rem; font-weight: 500;
    cursor: pointer; transition: all 0.15s;
  }
  .picker-btn:hover { border-color: var(--cyan); color: var(--cyan); }

  @media (max-width: 480px) {
    .masthead h1 { font-size: 2rem; }
    .score-total { font-size: 2rem; }
  }
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="kick">Premier League Blackjack</div>
    <h2>Who Are You?</h2>
    <p>Enter your first name to highlight your entry on the table.</p>
    <input type="text" id="name-input" placeholder="Your first name…" maxlength="30" />
    <div class="modal-err" id="name-err"></div>
    <div id="name-picker" style="display:none"></div>
    <button class="modal-btn" onclick="submitName()">Find My Entry</button>
    <button class="modal-skip" onclick="skipName()">Just show me the table</button>
  </div>
</div>

<nav class="nav">
  <button class="nav-btn active" onclick="switchTab('board', this)">Table</button>
  <button class="nav-btn" onclick="switchTab('players', this)">Players</button>
</nav>

<!-- BOARD -->
<div class="screen active" id="screen-board">
  <div class="masthead">
    <div class="eyebrow">2026/27 Season</div>
    <h1>Premier League <em>Blackjack</em></h1>
    <div class="updated">Updated <b id="updated">—</b></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="identity">
    <button class="id-chip hidden" id="id-chip" onclick="resetName()">◆ <span id="chip-name"></span> · change</button>
  </div>

  <div class="filters">
    <button class="filt active" onclick="setFilter('all', this)">All</button>
    <button class="filt" onclick="setFilter('live', this)">Live</button>
    <button class="filt" onclick="setFilter('busted', this)">Bust</button>
  </div>

  <div class="board" id="board"></div>
</div>

<!-- PLAYERS -->
<div class="screen" id="screen-players">
  <div class="masthead">
    <div class="eyebrow">Goal Machine</div>
    <h1>The <em>Players</em></h1>
  </div>
  <div class="plist" id="plist"></div>
</div>

<script src="data.js"></script>
<script>
let currentUser = null;
let currentFilter = 'all';

function clubOf(code) { return CLUBS[code] || { name: code, color: '#666' }; }
function buildPlayerMap() { const m = {}; PLAYERS.forEach(p => m[p.name] = p); return m; }
function expandEntry(e, m) {
  return { ...e, players: e.players.map(n => m[n] || { name: n, club: '?', goals: 0, out: false }) };
}
function getTotal(e) { return e.players.reduce((s, p) => s + p.goals, 0); }
function getTopGoal(e) { return Math.max(...e.players.map(p => p.goals)); }
function getStatus(e) {
  if (getTotal(e) > CAP) return { status: 'busted', reason: 'over' };
  const dead = e.players.find(p => p.out && p.goals === 0);
  if (dead) return { status: 'busted', reason: 'out' };
  return { status: 'live', reason: '' };
}

function processEntries() {
  const m = buildPlayerMap();
  return ENTRIES.map(e => {
    const ex = expandEntry(e, m);
    const st = getStatus(ex);
    return { ...ex, total: getTotal(ex), status: st.status, topGoal: getTopGoal(ex) };
  }).sort((a, b) => {
    if (a.status !== b.status) return a.status === 'live' ? -1 : 1;
    if (a.status === 'live') {
      if (b.total !== a.total) return b.total - a.total;
      return b.topGoal - a.topGoal;
    }
    return b.total - a.total;
  });
}

function renderBoard() {
  const proc = processEntries();
  const live = proc.filter(e => e.status === 'live');
  const bust = proc.filter(e => e.status === 'busted');

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-val">${proc.length}</div><div class="stat-lbl">Entries</div></div>
    <div class="stat"><div class="stat-val live">${live.length}</div><div class="stat-lbl">Live</div></div>
    <div class="stat"><div class="stat-val bust">${bust.length}</div><div class="stat-lbl">Bust</div></div>
  `;
  document.getElementById('updated').textContent = LAST_UPDATED;

  const filtered = currentFilter === 'all' ? proc : proc.filter(e => e.status === currentFilter);
  const board = document.getElementById('board');
  board.innerHTML = '';
  let liveRank = 0, bustDiv = false;

  filtered.forEach((e, i) => {
    if (e.status === 'busted' && !bustDiv && currentFilter === 'all') {
      bustDiv = true;
      board.innerHTML += `<div class="divider"><span>Bust</span></div>`;
    }
    let rankHtml, rowClass = '';
    if (e.status === 'live') {
      liveRank++;
      rankHtml = `<div class="rank">${liveRank}</div>`;
      if (liveRank === 1) rowClass = 'r1';
    } else {
      rankHtml = `<div class="rank bust-rank">BUST</div>`;
      rowClass = 'busted';
    }
    const isMe = currentUser && e.name.toLowerCase() === currentUser.toLowerCase();
    if (isMe) rowClass += ' mine';
    const isLead = liveRank === 1 && e.status === 'live';
    const totalClass = e.status === 'busted' ? 'bust' : isLead ? 'lead' : '';
    const pct = Math.min(100, (e.total / CAP) * 100);
    const railColor = e.status === 'busted' ? 'var(--magenta)' : e.total >= CAP - 3 ? 'var(--cyan)' : 'var(--lime)';

    const picks = e.players.map(p => {
      const c = clubOf(p.club);
      const dead = p.out && p.goals === 0;
      const outMark = p.out ? `<span class="out-mark" title="Out">⊗</span>` : '';
      return `<div class="pick${dead ? ' dead' : ''}">
        <span class="club-badge" style="background:${c.color}"></span>
        <span class="pname">${p.name}${outMark}</span>
        <span class="pclub">${p.club}</span>
        <span class="pg ${p.goals === 0 ? 'z' : ''}">${p.goals}</span>
      </div>`;
    }).join('');

    const paidBadge = e.paid
      ? `<span class="paid-badge yes" title="Paid">£</span>`
      : `<span class="paid-badge no" title="Not paid">£</span>`;

    board.innerHTML += `
      <div class="row ${rowClass}" style="animation-delay:${i*0.04}s">
        ${rankHtml}
        <div class="entrant">
          <div class="entrant-name">${paidBadge}${e.name}</div>
          <div class="picks">${picks}</div>
        </div>
        <div class="score">
          <div class="score-total ${totalClass}">${e.total}</div>
          <div class="score-cap">/ ${CAP}</div>
          <div class="rail"><div class="rail-fill" style="width:${pct}%;background:${railColor}"></div></div>
        </div>
      </div>`;
  });

  if (filtered.length === 0) board.innerHTML = `<div style="text-align:center;padding:3rem;color:var(--muted);font-size:0.85rem;">No entries here</div>`;
}

function renderPlayers() {
  const ownerMap = {};
  ENTRIES.forEach(e => e.players.forEach(n => { (ownerMap[n] = ownerMap[n] || []).push(e.name); }));
  const sorted = [...PLAYERS].sort((a, b) => b.goals - a.goals);
  const list = document.getElementById('plist');
  list.innerHTML = '';
  sorted.forEach((p, i) => {
    const c = clubOf(p.club);
    const owners = ownerMap[p.name] || [];
    const outTag = p.out ? `<span class="out-tag">⊗ OUT</span>` : '';
    list.innerHTML += `
      <div class="prow${p.out ? ' out' : ''}" style="animation-delay:${i*0.03}s">
        <div class="prank">${i+1}</div>
        <div class="pbadge" style="background:${c.color}"></div>
        <div class="pinfo">
          <div class="pn">${p.name}${outTag}</div>
          <div class="pc">${c.name} · Picked by ${owners.length ? owners.join(', ') : '—'}</div>
        </div>
        <div>
          <div class="pgoals ${p.goals === 0 ? 'z' : ''}">${p.goals}</div>
          <div class="pgl">goals</div>
        </div>
      </div>`;
  });
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filt').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderBoard();
}
function switchTab(tab, btn) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + tab).classList.add('active');
  if (tab === 'players') renderPlayers();
}
// Levenshtein distance for typo-tolerant matching
function editDist(a, b) {
  a = a.toLowerCase(); b = b.toLowerCase();
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = Math.min(
        dp[i-1][j] + 1,
        dp[i][j-1] + 1,
        dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)
      );
  return dp[m][n];
}

// Find candidate entries for a typed name (first name, full name, or near-miss)
function matchEntries(val) {
  const q = val.trim().toLowerCase();
  if (!q) return [];
  // 1. Exact full-name match
  let hits = ENTRIES.filter(e => e.name.toLowerCase() === q);
  if (hits.length) return hits;
  // 2. First-name exact match (e.g. "chris" → all Chrises)
  hits = ENTRIES.filter(e => e.name.split(' ')[0].toLowerCase() === q);
  if (hits.length) return hits;
  // 3. Starts-with (first name or full) — handles "chris a", "rob d"
  hits = ENTRIES.filter(e => e.name.toLowerCase().startsWith(q));
  if (hits.length) return hits;
  // 4. Any word in the name starts with the query
  hits = ENTRIES.filter(e => e.name.toLowerCase().split(' ').some(w => w.startsWith(q)));
  if (hits.length) return hits;
  // 5. Fuzzy: edit distance ≤2 on first name, or ≤2 on full name
  hits = ENTRIES.filter(e => {
    const first = e.name.split(' ')[0].toLowerCase();
    return editDist(q, first) <= 2 || editDist(q, e.name.toLowerCase()) <= 2;
  });
  return hits;
}

function pickEntry(name) {
  currentUser = name;
  sessionStorage.setItem('plb_user', currentUser);
  closeOverlay();
}

function submitName() {
  const input = document.getElementById('name-input');
  const val = input.value.trim();
  const errEl = document.getElementById('name-err');
  const hits = matchEntries(val);

  if (hits.length === 0) {
    input.classList.add('err');
    errEl.textContent = 'No match — check spelling or skip.';
    return;
  }
  if (hits.length === 1) {
    pickEntry(hits[0].name);
    return;
  }
  // Multiple matches — show a picker of full names
  errEl.textContent = '';
  const picker = document.getElementById('name-picker');
  picker.innerHTML = `<div class="picker-lbl">More than one match — tap yours:</div>` +
    hits.map(h => `<button class="picker-btn" onclick="pickEntry('${h.name.replace(/'/g, "\\'")}')">${h.name}</button>`).join('');
  picker.style.display = 'block';
}
function skipName() { currentUser = null; sessionStorage.setItem('plb_user', '__skip__'); closeOverlay(); }
function resetName() {
  sessionStorage.removeItem('plb_user'); currentUser = null;
  document.getElementById('id-chip').classList.add('hidden');
  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('name-input').value = '';
  document.getElementById('name-err').textContent = '';
  const picker = document.getElementById('name-picker');
  picker.style.display = 'none'; picker.innerHTML = '';
}
function closeOverlay() {
  document.getElementById('overlay').classList.add('hidden');
  if (currentUser) { document.getElementById('chip-name').textContent = currentUser; document.getElementById('id-chip').classList.remove('hidden'); }
  renderBoard();
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('name-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitName();
    document.getElementById('name-input').classList.remove('err');
    document.getElementById('name-err').textContent = '';
  });
  const saved = sessionStorage.getItem('plb_user');
  if (saved === '__skip__') { document.getElementById('overlay').classList.add('hidden'); renderBoard(); }
  else if (saved) {
    const m = ENTRIES.find(e => e.name === saved);
    if (m) { currentUser = m.name; document.getElementById('chip-name').textContent = currentUser; document.getElementById('id-chip').classList.remove('hidden'); document.getElementById('overlay').classList.add('hidden'); }
    renderBoard();
  }
});
</script>
